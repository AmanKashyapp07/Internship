<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>microsoft/oa-problems &bull; DSA Tracker</title>
  <meta name="description" content="Minimal GitHub-style tracker for 212 Microsoft OA and interview problems across 1.cpp to 5.cpp and greedy.md.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260906_sticky">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="gh-header">
      <div class="gh-repo-bar">
        <div class="gh-repo-title">
          <svg class="gh-octicon" height="18" viewBox="0 0 16 16" width="18" fill="currentColor">
            <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path>
          </svg>
          <span class="repo-owner">microsoft</span>
          <span class="repo-slash">/</span>
          <span class="repo-name">interview-problems</span>
          <span class="repo-badge"><span class="badge-dot"></span>DSA Tracker</span>
        </div>
        <div class="gh-actions">
          <button id="markAllBtn" class="gh-btn gh-btn-action" title="Mark all filtered problems completed">
            <svg height="14" viewBox="0 0 16 16" width="14" fill="currentColor"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>
            Mark Filtered Done
          </button>
          <button id="resetAllBtn" class="gh-btn gh-btn-ghost" title="Reset completed items">
            <svg height="14" viewBox="0 0 16 16" width="14" fill="currentColor"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"></path></svg>
            Reset
          </button>
        </div>
      </div>
    </header>

    <!-- Milestone Progress Card (Sticky at top on scroll) -->
    <div class="gh-milestone-card" id="milestoneCard">
      <div class="gh-milestone-top">
        <div class="gh-milestone-stats">
          <div class="stat-chip stat-chip-done">
            <span class="stat-dot dot-done"></span>
            <span class="stat-num" id="statDone">0</span>
            <span class="stat-lbl">done</span>
          </div>
          <div class="stat-chip stat-chip-open">
            <span class="stat-dot dot-open"></span>
            <span class="stat-num" id="statRemaining">221</span>
            <span class="stat-lbl">open</span>
          </div>
          <div class="stat-chip stat-chip-star">
            <span class="stat-dot dot-star"></span>
            <span class="stat-num" id="statStarredMeta">11</span>
            <span class="stat-lbl">starred</span>
          </div>
          <div class="stat-chip stat-chip-total">
            <span class="stat-num" id="statTotal">221</span>
            <span class="stat-lbl">total</span>
          </div>
        </div>
        <div class="gh-progress-pill">
          <span id="progressPercent" class="gh-percent-text">0%</span>
          <span class="gh-percent-sub">completed</span>
        </div>
      </div>
      <div class="gh-progress-bar">
        <div id="progressBarFill" class="gh-progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="gh-filter-bar">
      <!-- Search Input -->
      <div class="gh-search-wrapper">
        <svg class="gh-search-icon" height="15" viewBox="0 0 16 16" width="15" fill="currentColor">
          <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="gh-search-input" 
          placeholder="Filter problems by name, pattern, complexity, or LC #..." 
          autocomplete="off"
          spellcheck="false"
        >
        <kbd class="gh-kbd">⌘K</kbd>
        <button id="clearSearchBtn" class="gh-clear-btn" title="Clear search" style="display: none;">&times;</button>
      </div>

      <!-- Subnav Navigation Row -->
      <div class="gh-nav-row">
        <div class="gh-subnav" id="filePills">
          <button class="gh-subnav-item active" data-file="all">All <span class="gh-counter">221</span></button>
          <button class="gh-subnav-item" data-file="1.cpp">1.cpp <span class="gh-counter">25</span></button>
          <button class="gh-subnav-item" data-file="2.cpp">2.cpp <span class="gh-counter">11</span></button>
          <button class="gh-subnav-item" data-file="3.cpp">3.cpp <span class="gh-counter">22</span></button>
          <button class="gh-subnav-item" data-file="4.cpp">4.cpp <span class="gh-counter">28</span></button>
          <button class="gh-subnav-item" data-file="greedy.md">greedy.md <span class="gh-counter">66</span></button>
          <button class="gh-subnav-item" data-file="pyq1.cpp">pyq1.cpp <span class="gh-counter">31</span></button>
          <button class="gh-subnav-item" data-file="pyq2.cpp">pyq2.cpp <span class="gh-counter">38</span></button>
        </div>

        <div class="gh-status-group" id="statusToggles">
          <button class="gh-status-btn active" data-status="all">All</button>
          <button class="gh-status-btn" data-status="todo">Todo</button>
          <button class="gh-status-btn" data-status="completed">Done</button>
          <button class="gh-status-btn" data-status="starred" id="starredFilterBtn" title="Show only starred problems">
            <svg height="12" viewBox="0 0 16 16" width="12" fill="currentColor" style="vertical-align: -1px; margin-right: 3px; color: #e3b341;">
              <path d="m8 .25 2.062 5.093 5.438.423-4.14 3.567 1.259 5.337L8 11.838l-4.619 2.832 1.259-5.337-4.14-3.567 5.438-.423L8 .25Z"></path>
            </svg>Starred (<span id="statStarred">11</span>)
          </button>
        </div>
      </div>
    </div>

    <!-- Problems List (GitHub Box) -->
    <div class="gh-box">
      <div class="gh-box-header">
        <div class="gh-header-title">
          <span id="filteredCount"><strong>221</strong> problems</span>
        </div>
      </div>
      <main class="gh-box-body" id="problemsList" role="list">
        <!-- Injected problem rows -->
      </main>
      <div id="emptyState" class="gh-empty-state" style="display: none;">
        <svg height="28" viewBox="0 0 16 16" width="28" fill="currentColor">
          <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path>
          <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Z"></path>
        </svg>
        <p>No matching problems found.</p>
        <span class="empty-hint">Try adjusting your filters or search keywords.</span>
      </div>
    </div>
  </div>

  <script src="problems.js?v=20260906_pyq"></script>
  <script src="app.js?v=20260906_sticky"></script>
</body>
</html>
